# Tuned for a memory-constrained (7.6GB RAM) build machine.
# The Flutter-template default (-Xmx8G for the Gradle daemon, plus an
# unbounded Kotlin compile daemon) exceeds physical RAM here and gets OOM-killed.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvm.options=-Xmx1024m,-XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
